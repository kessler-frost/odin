name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      # `nebula-cert` is a REAL dependency of the gateway's VPC/SG tests: they
      # bootstrap an actual Nebula CA rather than faking one, which is the whole
      # reason those tests are worth having. Without it 85 of them failed with
      # `nebula-cert: command not found` -- CI had been red for every run since
      # 2026-07-26 while the suite was green locally, purely because the dev
      # machine has it from brew and the runner does not. Version tracks
      # `compute/cloud_init.py::NEBULA_VERSION`, so one mesh protocol is spoken
      # everywhere.
      - name: Install nebula
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^NEBULA_VERSION = "\(.*\)"/\1/p' src/odin/compute/cloud_init.py)"
          test -n "$VERSION"
          curl -fsSL -o /tmp/nebula.tar.gz \
            "https://github.com/slackhq/nebula/releases/download/v${VERSION}/nebula-linux-amd64.tar.gz"
          sudo tar -xzf /tmp/nebula.tar.gz -C /usr/local/bin nebula nebula-cert
          nebula-cert -version
      # No `if:` here, deliberately. The gate belongs on the tofu-MARKED suite
      # below, not on the binary: the main suite has a test that asserts a
      # refinement was validated, and without tofu on PATH it fails with
      # "tofu not on PATH -- cannot validate refinement" on every matrix entry
      # that skipped the install. Gating the install left 3.12 green and 3.14
      # red for the same code, which reads as a version incompatibility and is
      # not one.
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - name: Lint
        run: uv run ruff check .
      # `-n auto`: measured 8.6x locally, and CI was taking ~11 minutes serially.
      # The precondition is IDENTICAL results, not merely a green run -- verified
      # by comparing full pass/fail counts both ways before adopting.
      - name: Test
        run: uv run pytest -q -n auto
      - name: Test (Moto + tofu)
        if: matrix.python-version == '3.12'
        run: uv run pytest -m tofu -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
