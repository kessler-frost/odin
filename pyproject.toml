[project]
name = "odin"
version = "0.8.18"
description = "Odin: a local-first AWS-compatible cloud. Design AWS architectures on a drag-drop canvas; apply them for real onto local open-source substitutes (RustFS, goaws, dynalite, Postgres) on Colima/Lima."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=14.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "claude-agent-sdk>=0.1.39",
    "typer>=0.15",
    # asyncpg (Apache-2.0), not psycopg2 (LGPL-3.0) or psycopg3 (LGPL-3.0):
    # odin ships permissive licences only, and psycopg2 had quietly been the
    # exception. It is also the only Postgres driver here with a native async
    # API. MEASURED against a real WEDGED Postgres (docker pause -- field
    # test 6's F4): psycopg2 blocked the loop 3008ms for 1 heartbeat tick,
    # async managed 264. A healthy DB fast-fails in 0.42-5.8ms and would not
    # have justified the swap; a wedged one blocks 85.7% of wall clock for up
    # to 180s, freezing gateway and reconciler together.
    "asyncpg>=0.30",
    "python-hcl2>=8.1.2",
    # Apache-2.0 OR BSD-3-Clause, and ALREADY RESOLVED in uv.lock before this
    # line existed (`pyjwt[crypto]` pulls it transitively) -- so this promotes a
    # dependency odin already shipped rather than adding one. It is here for
    # `AESGCM`, which seals the secret/parameter sidecars (`gateway/kms.py`).
    # There is no stdlib alternative: Python ships `hashlib`/`hmac` and no
    # block cipher at all, so the choice was this or writing an AEAD.
    "cryptography>=44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "respx>=0.21",  # BSD-3-Clause; httpx mocking for the CLI's unit tests
    # MIT. The suite is ~2500 tests and the de-threading work made many of them
    # actually RUN where they previously errored out in milliseconds, so serial
    # wall-clock went past 15 minutes. MEASURED on tests/agent+api+aws:
    # 238.08s serial -> 27.79s with `-n auto` (8.6x), with byte-identical
    # results (42 failed / 595 passed / 37 errors both ways). Identical results
    # are the precondition -- a parallel run that CHANGES outcomes is a broken
    # suite, not a fast one.
    "pytest-xdist>=3.6",
]

[project.scripts]
odin = "odin.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odin"]
# Include the bundled UI (gitignored, copied in at release/build time).
artifacts = ["src/odin/_ui/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-m", "not integration"]
markers = [
    "integration: needs real Colima/Lima backings or the Claude agent — off by default",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
